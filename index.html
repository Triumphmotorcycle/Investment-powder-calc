
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151b">
  <title>Investment Powder Calculator | Workshop Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #191f27;
      --panel-light: #202833;
      --border: #303a46;
      --text: #edf2f7;
      --muted: #9ba8b7;
      --accent: #53d6c3;
      --accent-dark: #163e3b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    .page { width: 100%; max-width: 960px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-dark);
      border: 1px solid #28645d;
      color: var(--accent);
      font-size: 19px;
    }

    .top-label, .step-label {
      color: var(--muted);
      font-size: 12px;
    }

    .top-label {
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .intro { margin-bottom: 26px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .subtitle {
      max-width: 660px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      padding: 24px;
      margin-bottom: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    h3 { margin: 0; font-size: 15px; }

    .flask-entry {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      align-items: start;
      gap: 12px;
      margin-bottom: 12px;
      padding: 14px;
      background: #141a21;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .field { min-width: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      padding: 10px 11px;
      background: #11171e;
      color: var(--text);
      border: 1px solid #3a4654;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
    }

    input::placeholder { color: #687686; }

    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    button {
      min-height: 42px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .primary-button {
      background: var(--accent);
      color: #10201e;
    }

    .primary-button:hover { background: #76e4d4; }

    .secondary-button {
      background: var(--panel-light);
      border-color: var(--border);
      color: var(--text);
    }

    .secondary-button:hover { background: #2a3542; }

    .remove-button {
      min-width: 40px;
      padding: 8px 11px;
      background: #302126;
      border-color: #54343c;
      color: #ffb5be;
    }

    .remove-button:hover { background: #452a32; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .setting-group {
      padding: 18px;
      background: #141a21;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .setting-group .field + .field { margin-top: 16px; }

    .settings-stack {
      display: grid;
      gap: 14px;
    }

    .result {
      padding: 22px;
      background: #132a29;
      border: 1px solid #28534e;
      border-radius: 12px;
    }

    .result-heading {
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-item {
      padding: 14px;
      background: rgba(8, 20, 20, .42);
      border: 1px solid #28534e;
      border-radius: 9px;
    }

    .result-item strong {
      display: block;
      margin-bottom: 5px;
      color: #b5cbc8;
      font-size: 12px;
      font-weight: 600;
    }

    .result-item span {
      color: var(--text);
      font-size: 21px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .result-item small {
      color: #b5cbc8;
      font-size: 12px;
    }

    .result-empty { color: var(--muted); font-size: 14px; }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 700px) {
      body { padding: 20px 13px; }
      .top-label { display: none; }
      .panel { padding: 17px; }
      .flask-entry { grid-template-columns: 1fr 1fr; }
      .flask-entry .remove-button { justify-self: start; }
      .settings-grid { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 400px) {
      .flask-entry { grid-template-columns: 1fr; }
    }
